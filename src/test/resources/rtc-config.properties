# RTC Smart Driver Configuration
# ================================

# RTC API Configuration
rtc.api.url=http://localhost:8080/api/rtc
rtc.api.key=your-api-key-here

# Browser selection
rtc.browser.type=chrome           # chrome|firefox|edge (fallbacks to chrome if unsupported)
# Headless mode
rtc.browser.headless=false
# Selenium Grid
rtc.browser.grid.enabled=false
# Optional: if enabled, URL auto-detects from SELENIUM_GRID_URL (sysprop/env) else defaults to http://localhost:4444/wd/hub
# Set explicitly if you want to override auto-detect:
rtc.browser.grid.url=http://localhost:4444/wd/hub

# Healing Configuration
rtc.healing.enabled=true
rtc.healing.timeout=30
rtc.healing.retry.count=1

# Logging Configuration
rtc.logging.level=INFO
rtc.logging.healing=true

# Advanced Configuration (Optional)
rtc.healing.strategies=all
rtc.healing.cross.strategy=true
rtc.healing.ai.enabled=true

# Report updater configuration (used by rtc-client only)
rtc.report.updater.port=9099
rtc.report.createBackup=true

# Git/PR configuration for Create PR button
rtc.git.repoPath=C:\\Users\\mayank\\Documents\\GitHub\\rtctek-locator-failures-new
rtc.git.baseBranch=rtc_child_project
rtc.git.branchName=fix_locators
rtc.git.remote=origin
rtc.git.push.enable=true
rtc.git.user.name=MayankKakkar
rtc.git.user.email=mayank.kakkar@rtctek.com
rtc.git.commitMessage=updating old locators with healed locators

